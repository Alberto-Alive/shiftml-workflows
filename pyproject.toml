[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftml-workflows"
version = "0.5.0"
description = "Workflow-friendly CLI and library for ShiftML3 predictions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ShiftML Workflows Contributors" }
]
keywords = ["nmr", "shiftml", "ase", "workflows", "hpc"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24,<3",
  "ase>=3.22,<4",
  "pandas>=2,<3",
  "typer>=0.12,<1",
  "shiftml>=0.0.0,<2",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14,<20"]
spectra = ["soprano>=0.9,<1", "matplotlib>=3.8,<4"]
pretty = ["rich>=13,<15"]
yaml = ["PyYAML>=6,<7"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6"]

[project.scripts]
shiftmlwf = "shiftml_workflows.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: marks tests that require ShiftML model download (opt-in)",
]
